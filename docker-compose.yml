name: metercalc
services:
  app:
    build: .
    container_name: metercalc-app
    ports: ["${APP_PORT:-18217}:8000"]
    environment:
      - APP_PORT=18217
      - METERCALC_DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - metercalc-data:/app/data
volumes:
  metercalc-data:
